services:
  - type: web
    name: marketlens
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Hosting__PublicMode
        value: "true"
      - key: PORT
        value: "10000"

      - key: MarketData__Provider
        value: TwelveData
      - key: MarketData__TwelveDataApiKey
        sync: false
      - key: Hosting__OwnerPassword
        sync: false
